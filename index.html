<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça Palavras - configuração</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <fieldset id="configurar_field">
        <legend>Configurar</legend>
        <div>
            <label for="tamanhoInput">Tamanho</label>
            <input type="number" placeholder="tamanho (Ex.: 20x20)" id="tamanhoInput" value="20">
        </div>
        <div>
            <label for="quantidadePalavras">quantidade de palavras</label>
            <input type="number" placeholder="quantidade de palavras (Ex.: 5)" id="quantidadePalavras" value="5">
        </div>
        <div class="checkbox_div">
            <label for="inverterPalavras">Palavras invertidas?</label>
            <input type="checkbox" id="inverterPalavras" value="checked" checked>
        </div>
        <div class="checkbox_div">
            <label for="minusculo">Palavras em minúsculo (debug)?</label>
            <input type="checkbox" id="minusculo">
        </div>
        <button onclick="config.jogar()">jogar</button>
    </fieldset>
    <script src="js/configurarUI.js"></script>
</body>
</html>
